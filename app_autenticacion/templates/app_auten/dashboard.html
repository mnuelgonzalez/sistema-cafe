<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Café & Aroma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f5f0eb;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar-cafe {
            background: linear-gradient(135deg, #6f4e37 0%, #a67c52 100%);
            color: white;
            padding: 15px 0;
        }
        .navbar-cafe a, .navbar-cafe span {
            color: white;
            text-decoration: none;
        }
        .welcome-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
            margin-top: 40px;
        }
        .welcome-card i {
            font-size: 60px;
            color: #6f4e37;
        }
        .btn-coffee {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 10px;
        }
        .btn-coffee:hover {
            background-color: #5a3e2b;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-cafe">
        <div class="container">
            <span class="navbar-brand"><i class="fas fa-mug-hot"></i> Café & Aroma</span>
            <div class="ms-auto">
                <span class="me-3"><i class="fas fa-user"></i> {{ usuario.username }}</span>
                <a href="{% url 'cerrar_sesion' %}" class="btn btn-light btn-sm">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <i class="fas fa-coffee"></i>
            <h2 class="mt-3">¡Bienvenido, {{ usuario.username }}!</h2>
            <p class="text-muted">Has iniciado sesión correctamente en el sistema de gestión de Café & Aroma.</p>
            <hr>
            <p>📊 Aquí verás tus reportes de ventas, inventario y pedidos.</p>
            <a href="{% url 'cerrar_sesion' %}" class="btn btn-coffee mt-3">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</body>
</html>
