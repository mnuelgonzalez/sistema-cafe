{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Café & Aroma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Navbar con logo integrado -->
    <nav class="navbar navbar-expand-lg navbar-cafe">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="{% static 'img/logo.png' %}" alt="Logo">
                Café & Aroma
            </a>
            
            <div class="user-info">
                <span><i class="fas fa-user"></i> {{ usuario.username }}</span>
                <a href="{% url 'cerrar_sesion' %}" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container">
        <div class="welcome-card">
            <div class="welcome-icon">
                <i class="fas fa-coffee"></i>
            </div>
            
            <h2>¡Bienvenido, {{ usuario.username }}!</h2>
            <p>Has iniciado sesión correctamente en el sistema de gestión de Café & Aroma.</p>
            
            <div class="divider"></div>
            
            <p class="stats-info">
                <i class="fas fa-chart-bar"></i> Aquí verás tus reportes de ventas, inventario y pedidos.
            </p>
            
            <a href="{% url 'cerrar_sesion' %}" class="btn-main-logout">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </a>
        </div>
    </div>
    <script>
        // Detectar cuando el usuario presiona "Atrás" y forzar recarga
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                console.log('Página cargada desde bfcache - Recargando...');
                window.location.reload();
            }
        });
    </script>
</body>
</html>
