<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Café & Aroma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f5f0eb;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar-cafe {
            background: linear-gradient(135deg, #6f4e37 0%, #a67c52 100%);
            color: white;
            padding: 15px 0;
        }
        .navbar-cafe a, .navbar-cafe span {
            color: white;
            text-decoration: none;
        }
        .welcome-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
            margin-top: 40px;
        }
        .welcome-card i {
            font-size: 60px;
            color: #6f4e37;
        }

        /* --- BOTÓN DE CERRAR SESIÓN (navbar) --- */
        .btn-logout-nav {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-logout-nav:hover {
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
        }

        /* BOTÓN DE CERRAR SESIÓN (centro)*/
        .btn-logout-main {
            background-color: #6f4e37;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-logout-main:hover {
            background-color: #5a3e2b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(111, 78, 55, 0.4);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-cafe">
        <div class="container">
            <span class="navbar-brand"><i class="fas fa-mug-hot"></i> Café & Aroma</span>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span><i class="fas fa-user"></i> {{ usuario.username }}</span>
                <a href="{% url 'cerrar_sesion' %}" class="btn-logout-nav">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="welcome-card">
            <i class="fas fa-coffee"></i>
            <h2 class="mt-3">¡Bienvenido, {{ usuario.username }}!</h2>
            <p class="text-muted">Has iniciado sesión correctamente en el sistema de gestión de Café & Aroma.</p>
            <hr>
            <p>📊 Aquí verás tus reportes de ventas, inventario y pedidos.</p>
            <a href="{% url 'cerrar_sesion' %}" class="btn-logout-main mt-3">
               Cerrar Sesión
            </a>
        </div>
    </div>
    <script>
    // Detectar cuando el usuario presiona "Atrás" y forzar recarga
    window.addEventListener('pageshow', function(event) {
        // Si la página viene de bfcache (botón atrás), forzar recarga
        if (event.persisted) {
            console.log('🔄 Página cargada desde bfcache - Recargando...');
            window.location.reload();
        }
    });
    
    // También verificar al cargar la página
    window.addEventListener('load', function() {
        // Hacer una petición al servidor para verificar autenticación
        fetch('/autenticacion/dashboard/', {
            method: 'HEAD',
            credentials: 'same-origin'
        })
        .then(response => {
            // Si el servidor responde con 302 (redirect), no estamos autenticados
            if (response.redirected) {
                console.log('🔒 No autenticado - Redirigiendo al login');
                window.location.href = '/';
            }
        })
        .catch(error => {
            console.error('Error verificando autenticación:', error);
        });
    });
</script>
</body>
</html>
