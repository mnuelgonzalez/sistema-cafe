{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Café & Aroma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background: linear-gradient(135deg, #6f4e37 0%, #a67c52 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    
    <!-- Logo en esquina superior izquierda -->
    <div class="logo-top-left">
        <img src="{% static 'img/logo.png' %}" alt="Logo Café & Aroma" style="width: 60px;">
    </div>

    <div class="login-card">
        <div class="coffee-icon">
            <i class="fas fa-mug-hot"></i>
        </div>
        <h3 class="text-center mb-4" style="color: #6f4e37;">Café & Aroma</h3>
        
        {% if mensaje %}
            <div class="alert {% if 'exitosa' in mensaje %}alert-success{% else %}alert-danger{% endif %}">
                {{ mensaje }}
            </div>
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-coffee w-100">Ingresar</button>
        </form>
    </div>
</body>
</html>
