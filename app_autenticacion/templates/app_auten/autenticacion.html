<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Café & Aroma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #6f4e37 0%, #a67c52 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .coffee-icon {
            font-size: 50px;
            color: #6f4e37;
            text-align: center;
            margin-bottom: 10px;
        }
        .btn-coffee {
            background-color: #6f4e37;
            color: white;
            border: none;
        }
        .btn-coffee:hover {
            background-color: #5a3e2b;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="coffee-icon"><i class="fas fa-mug-hot"></i></div>
        <h3 class="text-center mb-4" style="color: #6f4e37;">Café & Aroma</h3>
        
        {% if mensaje %}
            <div class="alert {% if 'exitosa' in mensaje %}alert-success{% else %}alert-danger{% endif %}">
                {{ mensaje }}
            </div>
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-coffee w-100">Ingresar</button>
        </form>
    </div>
</body>
</html>
